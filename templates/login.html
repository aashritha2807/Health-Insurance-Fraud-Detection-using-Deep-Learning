<!DOCTYPE html>
<html>
<head>
    <title>Login - Health Insurance Fraud Detection</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #eef6ff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* MATCHING DASHBOARD HEADER */
        .header {
            width: 100%;
            background: #ffffff;
            padding: 25px 0;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1e3a8a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* CENTERED BOX AREA */
        .login-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 350px; 
            text-align: center; 
            border-top: 5px solid #1e3a8a; 
        }

        h2 { color: #1e3a8a; margin-bottom: 25px; } /* Adjusted margin since subtext is gone */
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: #1e3a8a; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }

        button:hover { opacity: 0.9; }
        
        .error { 
            background: #fef2f2; 
            color: #dc2626; 
            padding: 10px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            font-size: 13px; 
        }

        .footer { font-size: 11px; color: #94a3b8; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="header">HEALTH INSURANCE FRAUD DETECTION USING DEEP LEARNING</div>

    <div class="login-container">
        <div class="login-box">
            <h2>Employee Portal</h2>
            
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            
            <form method="POST">
                <input type="text" name="username" placeholder="Employee ID" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Access Dashboard</button>
            </form>

            <div class="footer">CONFIDENTIAL: Authorized Corporate Access Only.</div>
        </div>
    </div>

</body>
</html>
